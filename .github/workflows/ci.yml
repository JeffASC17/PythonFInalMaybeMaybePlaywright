name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://sampleapp.tricentis.com/101/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure Commandline
        run: npm install --global allure-commandline

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run browser tests and generate Allure report
        run: python run_tests.py

      - name: Upload Allure report and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-and-test-artifacts
          path: reports/
          if-no-files-found: ignore
